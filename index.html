<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dorm Dash — Healthy meal kits from $2, delivered to your dorm</title>
  <meta name="description" content="Affordable, pre-portioned breakfast, lunch, dinner and snack kits for college students. Pick up to 14 a week and a student dasher delivers them to your dorm." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="announce">Kits start at $2 · Free campus pickup or dorm delivery</div>

  <header class="site-header">
    <div class="wrap header-inner">
      <a href="#/" class="brand" aria-label="Dorm Dash home">
        <span class="brand-mark">DD</span>
        <span class="brand-name">Dorm Dash</span>
      </a>
      <nav class="main-nav" aria-label="Main">
        <a href="#/menu" data-nav="menu">Menu</a>
        <a href="#/how" data-nav="how">How it works</a>
        <a href="#/plan" data-nav="plan">My plan</a>
        <a href="#/dash" data-nav="dash">Become a dasher</a>
      </nav>
      <a href="#/login" class="auth-link" id="authLink">Log in</a>
      <a href="#/box" class="box-btn" aria-label="Open my box">
        My box <span class="box-count" id="boxCount">0</span>
      </a>
    </div>
  </header>

  <main id="app" tabindex="-1"></main>

  <footer class="site-footer">
    <div class="wrap footer-inner">
      <a href="#/" class="brand">
        <span class="brand-mark">DD</span>
        <span class="brand-name">Dorm Dash</span>
      </a>
      <p class="muted">Better dorm food, delivered by your campus community.</p>
      <p class="footer-copy">© 2026 Dorm Dash</p>
    </div>
  </footer>

  <div class="modal-backdrop" id="modal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <button class="modal-close" data-action="close-modal" aria-label="Close">×</button>
      <div id="modalBody"></div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
